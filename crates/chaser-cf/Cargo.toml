[package]
name = "chaser-cf"
version = "0.2.1"
edition = "2021"
description = "Vendored chaser-cf core, patched for chaser-resolverr-rs."
license = "MIT OR Apache-2.0"
repository = "https://github.com/0xchasercat/chaser-cf"

[lib]
name = "chaser_cf"
crate-type = ["lib"]

[dependencies]
tokio = { version = "1", features = ["full", "sync", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
url = "2"
once_cell = "1"
futures = "0.3"
rand = "0.9.3"
base64 = "0.22"
chaser-oxide = { version = "0.2.4", default-features = false, features = ["native-tls", "zip0"] }
